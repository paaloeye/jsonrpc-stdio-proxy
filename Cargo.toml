[package]
name = "jsonrpc-stdio-proxy"
version = "0.1.0"
edition = "2024"
description = "Transparent JSON-RPC stdio proxy with native OSLog tracing and metrics"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
log = "0.4"
oslog = "0.2"
serde_json = "1.0"
dashmap = "5.5"
